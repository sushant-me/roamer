name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: Install
        run: flutter pub get
      - name: Test
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-fatal-infos || true
      - name: Build web
        run: flutter build web --release --base-href /roamer/
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: roamer-web
          path: build/web

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: Install
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roamer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
